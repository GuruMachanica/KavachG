version: "3.8"

services:
  vajranetra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vajranetra_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=vajranetra_production_secure_secret_key_2026
      - ADMIN_PASSWORD=admin_vajranetra_2026
      - ADMIN_EMAIL=admin@vajranetra.com
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500
      - INCIDENT_API=http://localhost:8000/incidents/
    volumes:
      - ./Database:/app/Database
      - ./Models:/app/Models
